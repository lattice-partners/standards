# Template CI workflow. Copy to .github/workflows/ci.yml in your project.
# `lattice init` drops this in automatically for greenfield projects and pins
# the action to the standard version.
#
# The gate lives in the pre-commit hook, which runs before anything reaches a
# branch (ADR-0007). This is the backstop, so it runs where integration and
# release actually happen rather than on every pull request.
name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lattice-partners/standards/ci/actions/standards-check@main
