# Local Supabase stack. `supabase start` reads this file.
# Anything omitted falls back to the CLI defaults.

# Set this to the project slug. It only namespaces the local Docker containers,
# so it just has to be unique across the projects you run on this machine.
project_id = "app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3001"]

# Clerk is the identity provider. Supabase verifies Clerk-signed session tokens
# and applies Row Level Security against the Clerk claims in them.
#
# This is the third-party auth integration. The older Clerk integration built on
# JWT templates was deprecated on 1 April 2025: it required sharing the project
# JWT secret with Clerk, and rotating that secret meant downtime. Do not revive it.
#
# `domain` is the Clerk instance domain, for example example.clerk.accounts.dev.
# Set it to the development instance domain here; the hosted project gets its
# production domain configured in the Supabase dashboard instead.
[auth.third_party.clerk]
enabled = true
domain = "env(SUPABASE_AUTH_THIRD_PARTY_CLERK_DOMAIN)"

[storage]
enabled = true

[realtime]
enabled = true

[inbucket]
enabled = true
port = 54324
